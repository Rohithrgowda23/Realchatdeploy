
server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    connection-timeout: 10s

spring:
  application:
    name: realchat

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10

  lifecycle:
    timeout-per-shutdown-phase: 20s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        show_sql: false

  # Keep disabled until all existing migrations are PostgreSQL-compatible.
  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-ip: 30
    login-per-email: 10
    register-per-ip: 10
    forgot-per-ip: 10
    forgot-per-email: 3
    reset-per-ip: 10
    messages-per-minute: 60
    password-change-per-user: 5

  password-reset:
    ttl-minutes: 30

  mail:
    mode: ${MAIL_MODE:console}
    from: ${MAIL_FROM:no-reply@example.com}

  storage:
    dir: ${UPLOAD_DIR:./uploads}
    max-bytes: 26214400
    max-voice-bytes: 10485760

  ai:
    mode: ${AI_MODE:disabled}
    base-url: ${AI_BASE_URL:https://ollama.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemma4:31b}
    timeout-seconds: 60
    translate-per-hour: 60
    summary-per-hour: 10

  calls:
    stun-urls: ${CALL_STUN_URLS:stun:stun.l.google.com:19302}
    turn-urls: ${CALL_TURN_URLS:}
    turn-secret: ${CALL_TURN_SECRET:}
    turn-username: ${CALL_TURN_USERNAME:}
    turn-credential: ${CALL_TURN_CREDENTIAL:}

  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}

  ops:
    user: ${OPS_USER:realchat-ops}
    password: ${OPS_PASSWORD}

  oauth:
    backend-base-url: ${BACKEND_BASE_URL:http://localhost:8080}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:5173/oauth/callback}
    failure-redirect: ${OAUTH_FAILURE_REDIRECT:http://localhost:5173/login?oauth_error=1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: OPS
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-none} %logger{36} - %msg%n"
