server:
  port: 8080
  shutdown: graceful
  tomcat:
    connection-timeout: 10s

spring:
  application:
    name: realchat

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10

  lifecycle:
    timeout-per-shutdown-phase: 20s

  spring:
    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          jdbc:
            time_zone: UTC
          show_sql: true

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
	    client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}       # required, >= 32 bytes, never commit a real one
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  rate-limit:                        # sliding windows, per IP / email / user; see OPERATIONS_AND_DEPLOYMENT.md
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-ip: 30                 # per 15 min
    login-per-email: 10              # per 15 min
    register-per-ip: 10              # per hour
    forgot-per-ip: 10                # per hour
    forgot-per-email: 3              # per hour
    reset-per-ip: 10                 # per hour
    messages-per-minute: 60          # per user
    password-change-per-user: 5      # per 15 min
  password-reset:
    ttl-minutes: 30
  mail:
    mode: ${MAIL_MODE:console}       # console = DEV ONLY (link printed in log); smtp = real email
    from: ${MAIL_FROM:rohithgxowda001@gmail.com}
  storage:
    dir: ${UPLOAD_DIR:./uploads}      # keep OUTSIDE source control and back it up together with the database
    max-bytes: 26214400
    max-voice-bytes: 10485760
  ai:                                # optional AI translation + summaries; disabled unless you choose a provider
    mode: ${AI_MODE:disabled}        # disabled | ollama (local, free, private) | openai (any OpenAI-compatible service)
    base-url: ${AI_BASE_URL:http://localhost:11434}
    api-key: ${AI_API_KEY:}          # only for mode=openai; backend environment only, never sent to the browser
    model: ${AI_MODEL:llama3.2}
    timeout-seconds: 30
    translate-per-hour: 60           # per user
    summary-per-hour: 10             # per user
  calls:                            # WebRTC calls: STUN is enough on most home networks; strict firewalls need a TURN relay
    stun-urls: ${CALL_STUN_URLS:stun:stun.l.google.com:19302}
    turn-urls: ${CALL_TURN_URLS:}            # e.g. turn:turn.example.com:3478,turns:turn.example.com:5349
    turn-secret: ${CALL_TURN_SECRET:}        # coturn use-auth-secret: per-user logins that expire after an hour (preferred)
    turn-username: ${CALL_TURN_USERNAME:}    # only if you cannot use a secret
    turn-credential: ${CALL_TURN_CREDENTIAL:}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}   # delivers scheduled messages; polls every 15 s
  ops:                               # HTTP Basic login for /actuator/* (except /actuator/health)
    user: ${OPS_USER:realchat-ops}
    password: ${OPS_PASSWORD:cr9dIJUNwRExl0Hs6mtjSyL9JX4dW7cI}
  oauth:
    backend-base-url: ${BACKEND_BASE_URL:http://localhost:8080}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    # Where the browser lands after a successful or failed provider login
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:5173/oauth/callback}
    failure-redirect: ${OAUTH_FAILURE_REDIRECT:http://localhost:5173/login?oauth_error=1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized  # public callers only see UP/DOWN
      roles: OPS
      probes:
        enabled: true                # /actuator/health/liveness and /readiness

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-none} %logger{36} - %msg%n"